[project]
name = "reflective-qa"
version = "0.1.0"
description = "A reflection agent for grounded QA over research papers (QASPER), measured against one-shot answering."
readme = "README.md"
authors = [{ name = "Bhavya Sharma" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "bm25s>=0.3.13",
    "pystemmer>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
