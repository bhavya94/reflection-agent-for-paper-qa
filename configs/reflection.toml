# Code checks on a draft answer: free, deterministic feedback for the critic and the writer.
# Thresholds were set on the QASPER train split, not on dev.
# 10.1% of train's extractive and abstractive annotator answers are longer, so about 1 in 10 good answers is flagged.
max_answer_words = 35

# Reflection setups. Each takes one writer run's answers as first drafts (writer = a run in configs/answering.toml) and
# revises the flagged ones once with the same writer model. critic = "none" means code feedback only: the checks'
# findings go straight to the writer.
[critic]
effort = "medium"
# Thinking counts toward it. Caps a runaway review at about $0.02 (Sonnet, batch); a cut-off review keeps the draft.
max_tokens = 4000

[setups.sonnet-code-feedback]
writer = "sonnet-k20"
critic = "none"
code_feedback = true

[setups.haiku-code-feedback]
writer = "haiku-k5"
critic = "none"
code_feedback = true

[setups.sonnet-self-critique]
writer = "sonnet-k20"
critic = "claude-sonnet-5-5"
code_feedback = false

[setups.haiku-self-critique]
writer = "haiku-k5"
critic = "claude-haiku-5-5"
code_feedback = false

[setups.haiku-sonnet-critic]
writer = "haiku-k5"
critic = "claude-sonnet-5-5"
code_feedback = false

# Near-replicate of haiku-sonnet-critic: the checks flag almost no Haiku drafts, so the two differ only by a
# "none flagged" line. Their gap measures run-to-run noise more than the effect of code feedback.
[setups.haiku-sonnet-critic-checks]
writer = "haiku-k5"
critic = "claude-sonnet-5-5"
code_feedback = true

# Uncertainty of each setup's change in answer-F1: a paired bootstrap over the sampled questions.
[analysis]
bootstrap_resamples = 5000
seed = 0
# Two setups that see near-identical inputs; the gap between their results estimates run-to-run noise.
replicate_pair = ["haiku-sonnet-critic", "haiku-sonnet-critic-checks"]
