# Writer runs for the M1 baselines. k paragraphs come from BM25 (src/reflective_qa/retrieval.py); k = 0 is closed-book.
# Effort is set explicitly because the defaults differ: high on Sonnet 5.5, medium on Haiku 5.5.
max_tokens = 16000  # thinking counts toward it; billing is per generated token, so headroom is free

[runs.sonnet-k20]
model = "claude-sonnet-5-5"
k = 20
effort = "medium"

[runs.sonnet-closed-book]
model = "claude-sonnet-5-5"
k = 0
effort = "medium"

[runs.haiku-k5]
model = "claude-haiku-5-5"
k = 5
effort = "medium"

[costs]
# USD per million tokens, standard first-party rates as of 2026-10-06. The Batch API halves them.
batch_discount = 0.5
# Output tokens per answer (thinking included), used until a run has measured its own.
assumed_output_tokens = 500

[costs.prices.claude-sonnet-5-5]
input = 2.0
output = 10.0

[costs.prices.claude-haiku-5-5]
input = 0.10
output = 0.50

[sample]
# A seeded random sample of text-only dev questions, shared by M1–M4 to fit the $20 API budget.
# Smaller samples are prefixes of larger ones, so a pilot's answers count toward the full run.
questions = 200
seed = 0
